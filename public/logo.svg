<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf72"/>
      <stop offset="50%" stop-color="#a0c070"/>
      <stop offset="100%" stop-color="#c0392b"/>
