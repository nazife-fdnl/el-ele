    L94,120
    C94,117 97,115 100,115
    L112,113
    C120,112 128,114 133,118
    L140,124
    C145,128 146,134 142,138 Z
  " fill="#c0392b" opacity="0.92"/>

  <!-- RED hand fingers detail -->
  <path d="M115,144 C114,150 110,152 107,149 L107,143" fill="#c0392b" opacity="0.7"/>
  <path d="M105,145 C104,151 100,152 98,149 L98,143" fill="#c0392b" opacity="0.7"/>
  <path d="M95,143 C93,148 89,148 88,144 L89,138" fill="#c0392b" opacity="0.7"/>

